# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KEYBOARD_NAME="Teemos Corne"

# --- Battery reporting -------------------------------------------------------
# The peripheral measures its own level and serves it to the central over the
# split link; the central proxies it on to the host.
# The CENTRAL_BATTERY_LEVEL_* options must NOT be set here - they depend on
# ZMK_SPLIT_ROLE_CENTRAL and Zephyr turns unmet-dependency assignments into
# build errors.
CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

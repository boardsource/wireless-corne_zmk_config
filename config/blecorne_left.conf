# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KEYBOARD_NAME="Teemos Corne"

# --- Battery reporting to the host -------------------------------------------
# Implied by CONFIG_ZMK_BLE, set explicitly so it is visible here.
CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# The left half is the central. Pull the right half's level over the split
# link and expose it to the host as a second Battery Service instance, so the
# laptop sees both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
